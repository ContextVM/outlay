[package]
name = "outlay-relay"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
# `nostr-sdk` 0.45-alpha ships `LocalRelay` — a real NIP-01 WebSocket server —
# behind its `local-relay` feature. This is intentionally AHEAD of `outlay`'s
# 0.44 (pinned transitively by `contextvm-sdk`); the two versions coexist in the
# final binary because the crate boundary is a plain URL string, not nostr
# types. The default `outlay` build pulls neither this crate nor 0.45-alpha —
# the alpha is fully opt-in via outlay's `bundled-relay` feature.
# See src/lib.rs doc + design/design.md §9 (bundled relay).
nostr-sdk = { version = "0.45.0-alpha.6", features = ["local-relay"] }
# `NostrDatabase` trait + types (implemented by the always-compiled memoryless
# backend below).
nostr-database = "0.45.0-alpha.6"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"

# Persistent/volatile backends for outlay's bundled UPSTREAM relay. Optional so
# `outlay-shim` can depend on this crate for the memoryless relay (which needs
# neither) without statically linking SQLite into its binary.
nostr-sqlite = { version = "0.45.0-alpha.6", optional = true }
# `nostr-sqlite`'s default `bundled` feature statically links SQLite — no system
# libsqlite3 required (keeps the self-contained binary + future cross-compile honest).
nostr-memory = { version = "0.45.0-alpha.6", optional = true }

[features]
default = ["bundled-backends"]
# Persistent (SQLite) + volatile (memory) backends for outlay's bundled upstream
# relay. Off ⇒ only the memoryless backend (used by outlay-shim) is compiled.
bundled-backends = ["dep:nostr-sqlite", "dep:nostr-memory"]
