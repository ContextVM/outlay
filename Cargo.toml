# outlay workspace.
# Members: `crates/outlay` (CVM↔NIP-01 relay proxy server, bundled relay on by
# default), `crates/outlay-shim` (vanilla NIP-01 client bridge to CVM servers),
# and `crates/outlay-relay` (the in-process relay on nostr-sdk 0.45-alpha,
# pulled by outlay's default `bundled-relay` feature). See `design/design.md`
# and `design/shim.md`.
[workspace]
members = ["crates/*"]
resolver = "2"

# Cargo only honors [profile.*] in the root manifest; this applies to every
# member. Moved here from the (former) single-crate Cargo.toml.
[profile.release]
lto = true
codegen-units = 1
strip = true
